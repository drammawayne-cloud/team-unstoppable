name: Team Unstoppable iOS
on:
  push:
    paths: ['mobile/**', '.github/workflows/team-unstoppable-ios.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/team-unstoppable-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project and UI test target
        run: |
          python3 mobile/ios/generate_project.py
          python3 mobile/ios/enable_ui_tests.py
      - name: Validate content and models
        run: swift test --package-path mobile/ios
      - name: Build iPhone and iPad simulator app
        run: |
          set -o pipefail
          xcodebuild -project mobile/ios/TeamUnstoppable.xcodeproj -scheme TeamUnstoppable \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee xcode-build.log
      - name: Save compiled simulator app
        uses: actions/upload-artifact@v4
        with:
          name: TeamUnstoppable-Simulator-App
          path: |
            build/Build/Products/Debug-iphonesimulator/TeamUnstoppable.app
            xcode-build.log
          retention-days: 14
      - name: Test native navigation and bookmarks
        run: |
          set -o pipefail
          python3 -u mobile/ios/simulator_smoke.py | tee ui-test.log
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeamUnstoppable-UI-Evidence
          path: |
            simulator-screenshots/
            ui-results.xcresult
            ui-test.log
            xcode-build.log
          retention-days: 14
