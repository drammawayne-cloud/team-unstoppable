<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private team access — TEAM UNSTOPPABLE</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><header><a class="brand" href="/">TEAM UNSTOPPABLE</a><a href="/">Back to the site ↗</a></header><main class="admin"><section><p class="eyebrow">PRIVATE CONTROL CENTER</p><h1>Manage the movement.</h1><p id="status" role="status">Sign in to manage content, private enquiries and moderated chat.</p><form id="login"><label>Team password<input type="password" name="password" autocomplete="current-password" required></label><button class="button">Sign in</button></form><div id="workspace" hidden><button id="logout" class="outline">Sign out</button><div class="admin-panel"><form id="editor"><h3>Create a draft</h3><label>Section<select name="kind"><option value="team">Team profiles</option><option value="events">Events</option><option value="music">Music</option><option value="videos">Videos</option><option value="gallery">Gallery</option><option value="merch">Merchandise</option><option value="chat">Team chat reply</option></select></label><label>Title<input name="title" required maxlength="120"></label><label>Description / reply<textarea name="description" required maxlength="1000" rows="5"></textarea></label><label>HTTPS destination link<input name="url" type="url" placeholder="https://"></label><label>Approved image URL<input name="image" type="url" placeholder="https://"></label><p>Save drafts, inspect the content, then publish. Use approved content and checkout providers only.</p><button class="button">Save private draft</button></form><div><h3>Content, chat and private inbox</h3><label>Filter<select id="filter"><option value="all">All records</option><option value="booking">Private bookings</option><option value="chat">Chat moderation</option><option value="draft">Unpublished content</option></select></label><div id="records"></div></div></div></div></section></main></body></html>
